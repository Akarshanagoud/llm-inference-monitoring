global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: llm-gateway
    static_configs:
      - targets: ["gateway:8080"]

  # Scrape the model server directly too, so serving-layer metrics (KV cache,
  # queue depth) are available even when the gateway is unhealthy.
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
    honor_labels: true
