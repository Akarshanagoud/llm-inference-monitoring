apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels: { app: llm-gateway }
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # never drop capacity during a rollout
  selector:
    matchLabels: { app: llm-gateway }
  template:
    metadata:
      labels: { app: llm-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: ghcr.io/akarshanamachanpally/llm-inference-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: LLMOBS_BACKEND, value: "vllm" }
            - { name: LLMOBS_BASE_URL, value: "http://vllm:8000" }
            - { name: LLMOBS_MODEL, value: "meta-llama/Llama-3.1-8B-Instruct" }
            - { name: LLMOBS_DB, value: "/data/traces.db" }
            # Shed load at the edge rather than letting the queue grow until
            # every request times out.
            - { name: LLMOBS_MAX_IN_FLIGHT, value: "128" }
          # Liveness only asks "is the process serving?". If it also checked the
          # backend, a model outage would restart every gateway pod, which fixes
          # nothing and destroys the traces that explain the outage.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          # Readiness does check the backend, so an unhealthy pod is removed
          # from the Service without being killed.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: trace-data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: trace-data
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: llm-gateway }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels: { app: llm-gateway }
spec:
  selector: { app: llm-gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: llm-gateway }
