# Autoscaling on queue depth rather than CPU.
#
# CPU is a poor proxy for LLM gateway load: the gateway spends its time waiting
# on the model server, so CPU stays low while requests pile up. Queue depth is
# the signal that actually correlates with user-visible latency.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric: { name: llm_queue_depth }
        target:
          type: AverageValue
          averageValue: "8"
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      # Model replicas take minutes to become ready, so scale up decisively.
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 60 }
    scaleDown:
      # Scale down slowly: releasing a replica mid-generation costs a request.
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
