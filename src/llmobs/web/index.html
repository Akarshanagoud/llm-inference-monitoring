<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inference Observatory</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b5470f'/%3E%3Cpath d='M6 20l6-6 5 4 9-9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="kit.css">
  <style>
    :root { --accent: #b5470f; --accent-text: #b5470f; --accent-wash: rgba(181, 71, 15, 0.09); }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) { --accent-text: #f0a070; --accent-wash: rgba(240, 160, 112, 0.14); }
    }
    :root[data-theme="dark"] { --accent-text: #f0a070; --accent-wash: rgba(240, 160, 112, 0.14); }
    .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 16px; }
    .controls .group { display: flex; gap: 8px; align-items: center; }
    .controls .group > span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
    .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.5); animation: pulse 1.8s infinite; }
    .live.off i { background: var(--axis); animation: none; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.45); } 70% { box-shadow: 0 0 0 7px rgba(12, 163, 12, 0); } 100% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0); } }
    @media (prefers-reduced-motion: reduce) { .live i { animation: none; } }
    .slo-card .burns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .burn { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .burn .name { font-size: 11.5px; color: var(--muted); }
    .burn .val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .burn.hot { border-color: var(--critical); background: var(--critical-wash); }
    .wf { position: relative; }
    .wf-row { display: grid; grid-template-columns: minmax(120px, 30%) 1fr 70px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
    .wf-row:first-child { border-top: 0; }
    .wf-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
    .wf-bar { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 2px; }
    .wf-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .breakdown-bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); }
    .breakdown-bar > i { display: block; height: 100%; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true">IO</span><span class="brand-name">Inference Observatory</span><span class="brand-sub">llmobs</span></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="topbar-right">
        <span class="env-pill" id="env">connecting</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Theme"></button>
      </div>
    </div>
  </header>
  <main class="page" id="app"></main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
