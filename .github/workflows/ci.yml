name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=llmobs --cov-report=term-missing

  smoke:
    # Exercises the real request path end to end: load, trace inspection,
    # stage attribution, SLO replay and Prometheus output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[server]"
      - run: llmobs load -n 200 -c 16 --speed 200 --failure-rate 0.02 --db ci.db
      - run: llmobs stages --db ci.db
      - run: llmobs slo --db ci.db --json
      - name: Prometheus output must be valid exposition format
        run: |
          llmobs metrics -n 20 -c 4 --speed 500 --db ci.db > metrics.txt
          grep -q "^# TYPE llm_requests_total counter" metrics.txt
          grep -q "llm_request_duration_seconds_bucket" metrics.txt
          # every non-comment line must end in a parseable float
          awk '!/^#/ && NF { v=$NF; if (v+0 != v && v != "+Inf") { print "bad: " $0; exit 1 } }' metrics.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t llm-gateway:ci .
      - name: Boot and probe
        run: |
          docker run -d --name gw -p 8080:8080 -e LLMOBS_SIM_SPEED=500 llm-gateway:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8080/health && break || sleep 2
          done
          curl -sf localhost:8080/ready
          curl -sf -X POST localhost:8080/v1/generate \
            -H 'content-type: application/json' \
            -d '{"prompt":"hello","max_tokens":32}' | grep -q trace_id
          curl -sf localhost:8080/metrics | grep -q llm_requests_total
          docker rm -f gw

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          # ServiceMonitor/PrometheusRule are CRDs; skip rather than fail on them.
          ./kubeconform -strict -summary \
            -skip ServiceMonitor,PrometheusRule \
            deploy/k8s/
      - name: Validate Prometheus rules
        run: |
          docker run --rm -v "$PWD/deploy:/deploy" \
            --entrypoint promtool prom/prometheus:v2.53.0 check rules /deploy/alerts.yml
